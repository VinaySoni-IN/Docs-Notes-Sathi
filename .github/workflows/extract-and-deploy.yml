name: Extract, clean and deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Extract root ZIP, remove it and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p .bundle-extract
            unzip -q "$ZIP_FILE" -d .bundle-extract
            ROOT=.bundle-extract
            if [ "$(find .bundle-extract -mindepth 1 -maxdepth 1 -type d | wc -l)" = 1 ] && [ "$(find .bundle-extract -mindepth 1 -maxdepth 1 -type f | wc -l)" = 0 ]; then ROOT="$(find .bundle-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"; fi
            find "$ROOT" -mindepth 1 -maxdepth 1 -exec cp -R {} . \;
            rm -rf .bundle-extract "$ZIP_FILE"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/extract-and-deploy.yml
          git add -A
          git diff --cached --quiet || (git commit -m 'Extract site and remove one-time deployer' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - uses: actions/deploy-pages@v4
