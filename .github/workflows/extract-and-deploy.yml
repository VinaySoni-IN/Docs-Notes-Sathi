name: Extract, clean and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the first project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No root ZIP found; deploying the current repository files."
            exit 0
          fi
          mkdir -p .bundle-extract
          unzip -q "$ZIP_FILE" -d .bundle-extract
          ROOT=".bundle-extract"
          if [ "$(find .bundle-extract -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && [ "$(find .bundle-extract -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            ROOT="$(find .bundle-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi
          find "$ROOT" -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -R {} . \;
          rm -rf .bundle-extract "$ZIP_FILE"

      - name: Remove this one-time extractor
        shell: bash
        run: |
          rm -f .github/workflows/extract-and-deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract site bundle and remove one-time deployer"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
